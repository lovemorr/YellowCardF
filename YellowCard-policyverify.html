        /* Style for error messages shown in the table body */
        .error-message {
            color: #721c24; /* Dark red */
            background-color: #f8d7da; /* Light red */

        /* --- Style Adjustments --- */

        /* REMOVED: .bg-success rule. We now rely entirely on app.bundle.css for the green 'Valid' style */

        /* Red 'Invalid' style */
        .bg-danger {
            color: #721c24;            /* Dark red text */
            background-color: #f8d7da;  /* Light red background (similar feel to default success) */
            border-color: #f5c6cb;      /* Matching border color (if app.bundle.css adds borders) */
            font-style: italic;         /* Make text italic as requested */
            /* We assume padding, font-size, border-radius etc. are handled by the base classes */
            /* like 'custom-small-header' defined in app.bundle.css for consistency */
        }
        /* --- End Style Adjustments --- */


        /* Style first column of the table body */
        #policyTableBody td:first-child {
            width: 40%;
            font-weight: bold; /* Make labels bold */
        }

         /* Optional: Style for empty table body when invalid */
        #policyTableBody.invalid-card-body td {
             padding: 0.75rem 1.25rem; /* Add padding to make message visible */
             font-style: italic;
             color: #6c757d; /* Bootstrap secondary color */
             text-align: center;

                        style="color : #ff6444">YC</span>

        ];


        // --- Helper Functions ---

        function getQueryParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function displayError(message) {
            console.error("Displaying Error:", message);
            tableHeading.textContent = 'Error Occurred';
            // Use classList to only remove status classes, keeping base classes
            tableHeading.classList.remove('bg-success', 'bg-danger');
            tableBody.innerHTML = `<tr><td colspan="2" class="error-message">${message}</td></tr>`;
            tableBody.className = ''; // Reset table body class
        }

        function formatDate(date) {
            if (!(date instanceof Date) || isNaN(date)) { return 'Invalid Date'; }
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${day}-${month}-${year} ${hours}:${minutes}:${seconds}`;
        }

        // --- Database Functions ---

        async function loadDatabaseFromFile(dbFileName) {
            try {
                const SQL = await initSqlJs({ locateFile: file => `./${file}` });
                console.log("Fetching database file:", dbFileName);
                const response = await fetch(dbFileName);
                if (!response.ok) { throw new Error(`Failed to load database file '${dbFileName}': ${response.status} ${response.statusText}.`); }
                const buffer = await response.arrayBuffer();
                console.log("Database file fetched, size:", buffer.byteLength);
                const uint8Array = new Uint8Array(buffer);
                console.log("Initializing SQL.js database from buffer...");
                const db = new SQL.Database(uint8Array);
                console.log("SQL.js Database initialized successfully.");
                return db;
            } catch (error) {
                displayError(`Error loading database: ${error.message}`);
                console.error("Detailed error during database load:", error);
                return null;
            }
        }

        function loadPolicy(db, yellowCardNumber) {
            let policy = null;
            let stmt = null;
            try {
                stmt = db.prepare("SELECT * FROM yellow_card_policies WHERE yellow_card_number = :ycn");
                stmt.bind({ ':ycn': yellowCardNumber });
                console.log(`Executing query for yellow_card_number: ${yellowCardNumber}`);
                if (stmt.step()) {
                    policy = stmt.getAsObject();
                    console.log("Policy found in database:", policy);
                } else {
                    console.log("No policy found in database for:", yellowCardNumber);
                }
            } catch (error) {
                displayError(`Error querying policy data: ${error.message}`);
                console.error("SQL Query Error:", error);
            } finally {
                if (stmt) { stmt.free(); console.log("SQL statement freed."); }
            }
            return policy;
        }

        // --- Table Population Function ---

        function populateTable(policy) {
            tableBody.innerHTML = '';
            tableBody.className = ''; // Reset any special class

            const fields = [
                ["Verification Timestamp", "verification_timestamp"], ["PIC Name", "pic_name"],
                ["Yellow Card Number", "yellow_card_number"], ["Policy Number", "policy_number"],
                ["Issued On", "issued_on"], ["Issued Timestamp", "issued_timestamp"],
                ["Valid From", "valid_from"], ["Valid Upto", "valid_upto"],
                ["Customer Name", "customer_name"], ["Vehicle Make", "vehicle_make"],
                ["Vehicle Reg Number", "vehicle_reg_number"], ["Countries Covered", "countries_covered"],
                ["Vehicle Engine Number", "vehicle_engine_number"], ["Vehicle Chassis Number", "vehicle_chassis_number"],
                ["Vehicle Color", "vehicle_color"], ["No. of Seats", "no_of_seats"],
                ["Issuing NB Contact", "issuing_nb_contact"], ["Secretariat Contact", "secretariat_contact"]
            ];
            const verificationTime = formatDate(new Date());

            fields.forEach(([label, key]) => {
                const row = tableBody.insertRow();
                const cell1 = row.insertCell(); cell1.textContent = label;
                const cell2 = row.insertCell();
                cell2.textContent = (key === "verification_timestamp") ? verificationTime : (policy[key] ?? '');
            });
            console.log("Table populated with policy data.");
        }

        // --- Main Initialization Logic ---

        async function initializeAndLoad() {
            console.log("Starting initializeAndLoad function...");
            tableBody.innerHTML = '<tr><td colspan="2">Loading policy details... Please wait.</td></tr>';
            tableBody.className = '';

            const yellowCardNumber = getQueryParameter('yellow_card_number');

            if (!yellowCardNumber) {
                displayError("No Yellow Card number provided in the URL. Please add '?yellow_card_number=YOUR_NUMBER' to the web address.");
                return;
            }

            tableHeading.textContent = `Checking Yellow Card: ${yellowCardNumber}...`;
            // Use classList to preserve base classes from HTML
            tableHeading.classList.remove('bg-success', 'bg-danger');

            const db = await loadDatabaseFromFile('yellow_card.db');

            if (db) {
                console.log("Database handle obtained. Loading policy details...");
                const policy = loadPolicy(db, yellowCardNumber);

                if (policy) {
                    // Policy FOUND in the database
                    console.log(`Checking validity status for: ${yellowCardNumber}`);
                    const isInvalid = INVALID_YELLOW_CARD_NUMBERS.includes(yellowCardNumber);

                    if (isInvalid) {
                        // Policy is FOUND but is on the INVALID list
                        console.log(`Status: ${yellowCardNumber} is marked as INVALID.`);
                        tableHeading.textContent = `Yellow Card: ${yellowCardNumber} is Invalid`;
                        // Use classList.add/remove to manage styles
                        tableHeading.classList.remove('bg-success');
                        tableHeading.classList.add('bg-danger'); // Add red, italic style defined in CSS

                        // Do NOT populate table for invalid cards
                        tableBody.innerHTML = '<tr><td colspan="2">Details not displayed for invalid card.</td></tr>';
                        tableBody.className = 'invalid-card-body'; // Add class for specific styling
                        console.log("Table population skipped for invalid card.");

                    } else {
                        // Policy is FOUND and is NOT on the invalid list (VALID)
                        console.log(`Status: ${yellowCardNumber} is considered VALID.`);
                        tableHeading.textContent = `Yellow Card: ${yellowCardNumber} is Valid`;
                         // Use classList.add/remove to manage styles
                        tableHeading.classList.remove('bg-danger');
                        tableHeading.classList.add('bg-success'); // Add original green style via class

                        // Populate table ONLY if valid
                        populateTable(policy);
                    }

                } else {
                    // Policy was NOT FOUND in the database
                    if (!tableBody.querySelector('.error-message')) { // Avoid double errors
                         displayError(`No policy data found in the database for Yellow Card number: ${yellowCardNumber}`);
                    }
                }

                // Optional: Close DB
                // try { db.close(); console.log("Database closed."); } catch (e) { console.error("Error closing DB", e); }

            } else {
                // Database loading failed. displayError was already called.
                console.log("Initialization stopped because database could not be loaded.");
            }
        }

        // --- Start the application ---
        document.addEventListener('DOMContentLoaded', (event) => {
             initializeAndLoad();
        });
